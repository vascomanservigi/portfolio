<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - Tutti i post</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo">Portfolio</a>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="portfolio.html">Portfolio</a></li>
                <li><a href="posts.html" class="active">Blog</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="container">
            <h2>Articoli e Aggiornamenti</h2>
            <ul class="post-list" id="posts-container" style="padding: 0; list-style: none;">
                <p style="color: #666;">Caricamento post in corso...</p>
            </ul>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 - Tutti i diritti riservati</p>
    </footer>

    <script>
        // CONFIGURAZIONE: Inserisci qui i dati del tuo repository GitHub
        const username = "IL_TUO_USERNAME_GITHUB"; 
        const repoName = "NOME_DEL_REPOSITORY";
        const folderPath = "posts"; // Nome della cartella dei post

        async function loadPosts() {
            const container = document.getElementById('posts-container');
            const apiUrl = `https://api.github.com/repos/${username}/${repoName}/contents/${folderPath}`;

            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error("Impossibile recuperare i post");

                const files = await response.json();
                
                // Filtra solo i file HTML (escludendo eventuali file indesiderati)
                const htmlFiles = files.filter(file => file.name.endsWith('.html') && file.name !== 'index.html');

                if (htmlFiles.length === 0) {
                    container.innerHTML = "<p>Nessun post trovato.</p>";
                    return;
                }

                // Ordina i file dal più recente al più vecchio (basandosi sul nome/numerazione)
                htmlFiles.reverse();

                let output = '';

                // Cicla ogni file per leggerne il contenuto e prenderne il titolo reale
                for (const file of htmlFiles) {
                    let postTitle = file.name.replace('.html', '').replace(/-/g, ' '); // Fallback se la fetch fallisce

                    try {
                        const fileResponse = await fetch(file.download_url);
                        const htmlText = await fileResponse.text();
                        
                        // Estrae il testo racchiuso tra <title> e </title> nel file del post
                        const match = htmlText.match(/<title>(.*?)<\/title>/i);
                        if (match && match[1]) {
                            postTitle = match[1];
                        }
                    } catch (e) {
                        console.error("Errore lettura titolo per " + file.name, e);
                    }

                    // Mantiene esattamente l'aspetto estetico e la struttura coerente col tuo stile CSS
                    output += `
                        <li style="margin-bottom: 2rem;">
                            <h3 style="margin: 0.2rem 0;"><a href="${folderPath}/${file.name}" style="text-decoration: none; color: #111;">${postTitle}</a></h3>
                            <p style="margin: 0; color: #555; font-size: 0.9rem;">Leggi l'articolo completo...</p>
                        </li>
                    `;
                }

                container.innerHTML = output;

            } catch (error) {
                console.error(error);
                container.innerHTML = "<p style='color: red;'>Errore nel caricamento dei post da GitHub.</p>";
            }
        }

        loadPosts();
    </script>
</body>
</html>
