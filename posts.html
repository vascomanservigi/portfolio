<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - Tutti i post</title>
    <style>
        /* Stile specifico per questa pagina */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fafafa;
            color: #333;
            line-height: 1.6;
        }

        header {
            background: #fff;
            border-bottom: 1px solid #eaeaea;
            padding: 1rem 2rem;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1000px;
            margin: 0 auto;
        }

        nav .logo {
            font-weight: bold;
            text-decoration: none;
            color: #111;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 1.5rem;
            margin: 0;
            padding: 0;
        }

        nav ul li a {
            text-decoration: none;
            color: #666;
            font-size: 0.95rem;
        }

        nav ul li a.active, nav ul li a:hover {
            color: #111;
            font-weight: 600;
        }

        main {
            max-width: 800px;
            margin: 3rem auto;
            padding: 0 1.5rem;
        }

        .container h2 {
            font-size: 2rem;
            margin-bottom: 2rem;
        }

        .post-list {
            padding: 0;
            list-style: none;
        }

        footer {
            text-align: center;
            padding: 2rem;
            font-size: 0.85rem;
            color: #888;
            border-top: 1px solid #eaeaea;
            margin-top: 4rem;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo">Portfolio</a>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="portfolio.html">Portfolio</a></li>
                <li><a href="posts.html" class="active">Blog</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="container">
            <h2>Articoli e Aggiornamenti</h2>
            <ul class="post-list" id="posts-container">
                <p style="color: #666;">Caricamento post in corso...</p>
            </ul>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 - Tutti i diritti riservati</p>
    </footer>

    <script>
        // CONFIGURAZIONE: Inserisci qui i dati del tuo repository GitHub
        const username = "IL_TUO_USERNAME_GITHUB"; 
        const repoName = "NOME_DEL_REPOSITORY";
        const folderPath = "posts"; // Nome della cartella dei post

        async function loadPosts() {
            const container = document.getElementById('posts-container');
            const apiUrl = `https://api.github.com/repos/${username}/${repoName}/contents/${folderPath}`;

            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error("Impossibile recuperare i post");

                const files = await response.json();
                
                const htmlFiles = files.filter(file => file.name.endsWith('.html') && file.name !== 'index.html');

                if (htmlFiles.length === 0) {
                    container.innerHTML = "<p>Nessun post trovato.</p>";
                    return;
                }

                htmlFiles.reverse();

                let output = '';

                for (const file of htmlFiles) {
                    let postTitle = file.name.replace('.html', '').replace(/-/g, ' ');

                    try {
                        const fileResponse = await fetch(file.download_url);
                        const htmlText = await fileResponse.text();
                        
                        const match = htmlText.match(/<title>(.*?)<\/title>/i);
                        if (match && match[1]) {
                            postTitle = match[1];
                        }
                    } catch (e) {
                        console.error("Errore lettura titolo per " + file.name, e);
                    }

                    output += `
                        <li style="margin-bottom: 2rem;">
                            <h3 style="margin: 0.2rem 0;"><a href="${folderPath}/${file.name}" style="text-decoration: none; color: #111;">${postTitle}</a></h3>
                            <p style="margin: 0; color: #555; font-size: 0.9rem;">Leggi l'articolo completo...</p>
                        </li>
                    `;
                }

                container.innerHTML = output;

            } catch (error) {
                console.error(error);
                container.innerHTML = "<p style='color: red;'>Errore nel caricamento dei post da GitHub.</p>";
            }
        }

        loadPosts();
    </script>
</body>
</html>
